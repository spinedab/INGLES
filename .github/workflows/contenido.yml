name: Contenido

# Valida el contenido de estudio en cada push. No corre tests unitarios: no los
# hay, y el fallo real de este proyecto nunca ha sido la lógica sino el
# contenido — dos veces se encontró el mismo material escrito por duplicado en
# dos sitios, divergiendo en silencio. Esto lo impide.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vocabulario — validar y comprobar sincronía
        # Falla si un id se reasignó (rompería el progreso SRS de quien ya
        # estudia, guardado en localStorage['srs:<id>']), si falta un campo, o
        # si los decks generados no coinciden con content/vocab/*.tsv.
        run: python3 tools/build_vocab.py --check

      - name: Gramática — validar y comprobar sincronía
        # Falla si un 'answer' cae fuera del rango de opciones: dejaría un
        # ejercicio que el aprendiz no puede acertar nunca.
        run: python3 tools/build_grammar.py --check

      - name: Lecturas y listening — JSON válido y respuestas en rango
        run: |
          python3 - <<'PY'
          import json, pathlib, sys

          errores = []
          for carpeta in ('webapp/content/lecturas', 'webapp/content/listening'):
              for f in sorted(pathlib.Path(carpeta).glob('*.json')):
                  try:
                      d = json.loads(f.read_text())
                  except json.JSONDecodeError as e:
                      errores.append(f'{f}: JSON inválido — {e}')
                      continue
                  for campo in ('title', 'summary', 'questions'):
                      if not d.get(campo):
                          errores.append(f'{f}: falta «{campo}»')
                  for i, q in enumerate(d.get('questions', [])):
                      opts = q.get('options') or []
                      if len(opts) < 2:
                          errores.append(f'{f} q{i}: menos de 2 opciones')
                          continue
                      if len(set(opts)) != len(opts):
                          errores.append(f'{f} q{i}: opciones repetidas')
                      a = q.get('answer')
                      if not isinstance(a, int) or not (0 <= a < len(opts)):
                          errores.append(f'{f} q{i}: answer={a!r} fuera de rango')

          if errores:
              print(f'✗ {len(errores)} problema(s):')
              for e in errores:
                  print('  -', e)
              sys.exit(1)
          print('✓ lecturas y listening válidos')
          PY

      - name: webapp y mobile sirven el mismo contenido
        # Los dos consumen copias generadas; si divergen, un aprendiz ve cosas
        # distintas según el dispositivo.
        run: |
          python3 - <<'PY'
          import pathlib, sys

          fallos = []
          for sub in ('vocab', 'lecturas', 'listening'):
              w = pathlib.Path('webapp/content') / sub
              m = pathlib.Path('mobile/assets/content') / sub
              nw = {p.name for p in w.glob('*.json')}
              nm = {p.name for p in m.glob('*.json')}
              if nw != nm:
                  fallos.append(f'{sub}: solo en webapp {sorted(nw - nm)}, solo en mobile {sorted(nm - nw)}')
                  continue
              for n in sorted(nw):
                  if (w / n).read_text() != (m / n).read_text():
                      fallos.append(f'{sub}/{n}: el contenido difiere entre webapp y mobile')

          if fallos:
              print('✗ contenido desincronizado:')
              for f in fallos:
                  print('  -', f)
              sys.exit(1)
          print('✓ webapp y mobile sincronizados')
          PY

      - name: Todo el contenido está declarado en los índices
        # Añadir un fichero sin registrarlo lo deja invisible en la app. Pasó.
        run: |
          python3 - <<'PY'
          import pathlib, sys

          declaradores = {
              'lecturas': ['webapp/js/reading.js', 'mobile/lib/content.ts', 'webapp/sw.js'],
              'listening': ['webapp/js/listening.js', 'mobile/lib/content.ts', 'webapp/sw.js'],
          }
          fallos = []
          for sub, ficheros in declaradores.items():
              ids = [p.stem for p in sorted(pathlib.Path('webapp/content', sub).glob('*.json'))]
              for f in ficheros:
                  txt = pathlib.Path(f).read_text()
                  faltan = [i for i in ids if i not in txt]
                  if faltan:
                      fallos.append(f'{f}: no declara {faltan}')

          if fallos:
              print('✗ contenido sin declarar:')
              for f in fallos:
                  print('  -', f)
              sys.exit(1)
          print('✓ todo el contenido está declarado')
          PY

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile
