name: Contenido

# Valida el contenido de estudio en cada push. No corre tests unitarios: no los
# hay, y el fallo real de este proyecto nunca ha sido la lógica sino el
# contenido — dos veces se encontró el mismo material escrito por duplicado en
# dos sitios, divergiendo en silencio. Esto lo impide.
#
# Un solo generador (tools/build_content.py) cubre todos los idiomas y todos
# los tipos de contenido, y en modo --check falla si:
#   - un id de tarjeta se reasignó o duplicó (rompería el progreso SRS, que
#     vive en localStorage['srs:<deck>:<id>']),
#   - un 'answer' cae fuera del rango de opciones (ejercicio imposible),
#   - a una lectura o listening le falta un campo,
#   - lo generado para webapp y mobile no coincide con la fuente canónica, o
#     queda un fichero huérfano cuya fuente se borró.
# El índice de lecturas/listening se deriva de los ficheros, así que ya no hay
# lista que olvidar actualizar.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Contenido de todos los idiomas — validar y comprobar sincronía
        run: python3 tools/build_content.py --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - run: npx tsc --noEmit
        working-directory: mobile
